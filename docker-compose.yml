services:
  postgres:
    image: postgres:16-alpine
    container_name: operational-workspace-postgres
    environment:
      POSTGRES_DB: operational_workspace
      POSTGRES_USER: operational_workspace
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U operational_workspace -d operational_workspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
